<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GCP Services - By Domain - gcp-service-catalog</title>
    <script src="uvy-design/uvy-theme.js"></script>
    <link rel="stylesheet" href="uvy-design/uvy-tokens.css">
    <link rel="stylesheet" href="uvy-design/uvy-elements.css">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse Google Cloud Platform services by domain. Filter and explore GCP services organized by their API domains.">
    <script>
      // Filtering function for the domains list.
      function filterDomains() {
          var input = document.getElementById('searchInput');
          var filter = input.value.toLowerCase();
          var ul = document.getElementById('domainList');
          var li = ul.getElementsByTagName('li');
          for (var i = 0; i < li.length; i++) {
              var a = li[i].getElementsByTagName('a')[0];
              var textValue = a.textContent || a.innerText;
              if (textValue.toLowerCase().indexOf(filter) > -1) {
                  li[i].style.display = "";
              } else {
                  li[i].style.display = "none";
              }
          }
      }
    </script>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar" aria-label="Main navigation">
        <a href="index.html">gcp-service-catalog</a>
        <a href="services.html">Services</a>
        <a href="bydomain.html" class="active" aria-current="page">By Domain</a>
        <span>|</span>
        <a href="apis.html">APIs</a>

        <button class="uvy-theme-toggle" data-uvy-theme-toggle type="button" aria-label="Switch to dark mode" hidden><span class="uvy-theme-dark-icon">{{template "icon-moon"}}</span><span class="uvy-theme-light-icon">{{template "icon-sun"}}</span></button>
    </nav>
    <main>
        <section class="by-domain">
            <h1>Services by Domain</h1>
            <div class="search-container">
                <label class="sr-only" for="searchInput">Search domains</label>
                <input type="search" id="searchInput" onkeyup="filterDomains()" placeholder="Filter domains...">
                <span class="search-icon">{{template "icon-search"}}</span>
            </div>
            <ul id="domainList" class="item-list">
                {{range .Domains}}
                <li>
                    <a href="{{.Link}}">{{.Domain}}</a> ({{.Count}})
                </li>
                {{end}}
            </ul>
        </section>
    </main>
    {{template "footer"}}
</body>
</html>
