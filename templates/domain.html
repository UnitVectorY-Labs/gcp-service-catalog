<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GCP Services - {{.Domain}} Services - gcp-service-catalog</title>
    <script src="../uvy-design/uvy-theme.js"></script>
    <link rel="stylesheet" href="../uvy-design/uvy-tokens.css">
    <link rel="stylesheet" href="../uvy-design/uvy-elements.css">
    <link rel="stylesheet" href="../style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="List of Google Cloud Platform services in the '{{.Domain}}' domain.">
    <script>
      // Search filtering for services in a specific domain.
      function filterDomainServices() {
          var input = document.getElementById('searchInput');
          var filter = input.value.toLowerCase();
          var table = document.getElementById('domainServicesTable');
          var tr = table.getElementsByTagName('tr');
          for (var i = 1; i < tr.length; i++) {
              var tds = tr[i].getElementsByTagName('td');
              var show = false;
              for (var j = 0; j < tds.length; j++) {
                  if (tds[j].innerText.toLowerCase().indexOf(filter) > -1) {
                      show = true;
                      break;
                  }
              }
              tr[i].style.display = show ? "" : "none";
          }
      }
    </script>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar" aria-label="Main navigation">
        <a href="../index.html">gcp-service-catalog</a>
        <a href="../services.html">Services</a>
        <a href="../bydomain.html">By Domain</a>
        <a href="domain-{{.Domain | urlquery}}.html" class="active" aria-current="page">{{.Domain}}</a>
        <span>|</span>
        <a href="../apis.html">APIs</a>

        <button class="uvy-theme-toggle" data-uvy-theme-toggle type="button" aria-label="Switch to dark mode" hidden><span class="uvy-theme-dark-icon">{{template "icon-moon"}}</span><span class="uvy-theme-light-icon">{{template "icon-sun"}}</span></button>
    </nav>
    <main>
        <section class="domain-detail">
            <h1>Services in the "{{.Domain}}" Domain</h1>
            <div class="search-container">
                <label class="sr-only" for="searchInput">Search services</label>
                <input type="search" id="searchInput" oninput="filterDomainServices()" placeholder="Search services in this domain...">
                <span class="search-icon">{{template "icon-search"}}</span>
            </div>
            <table id="domainServicesTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Title</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .Services}}
                    <tr>
                        <td><a href="../service/{{.FileName}}.html">{{.Name}}</a></td>
                        <td>{{.Title}}</td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </section>
    </main>
    {{template "footer"}}
</body>
</html>
