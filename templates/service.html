<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GCP Services - {{.Name}} - gcp-service-catalog</title>
    <script src="../uvy-design/uvy-theme.js"></script>
    <link rel="stylesheet" href="../uvy-design/uvy-tokens.css">
    <link rel="stylesheet" href="../uvy-design/uvy-elements.css">
    <link rel="stylesheet" href="../style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The '{{.Title}}' Google Cloud Platform (GCP) service.">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar" aria-label="Main navigation">
        <a href="../index.html">gcp-service-catalog</a>
        <a href="../services.html">Services</a>
        <a href="../bydomain.html">By Domain</a>
        <span>|</span>
        <a href="../apis.html">APIs</a>

        <button class="uvy-theme-toggle" data-uvy-theme-toggle type="button" aria-label="Switch to dark mode" hidden><span class="uvy-theme-dark-icon">{{template "icon-moon"}}</span><span class="uvy-theme-light-icon">{{template "icon-sun"}}</span></button>
    </nav>
    <main>
        <section class="service-detail">
            <h1>{{.Title}}</h1>
            <p><strong>Service Name:</strong> {{.Name}}</p>
            {{if .Documentation}}
            <p><strong>Documentation Summary:</strong> {{.Documentation}}</p>
            {{end}}
        </section>
    </main>
    {{template "footer"}}
</body>
</html>
